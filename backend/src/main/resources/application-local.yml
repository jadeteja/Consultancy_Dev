# Local Development Profile using in-memory H2 database
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:careerbridge;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  consultancy:
    whatsapp-number: "917285927080"
    default-admin-email: "nextstepsolutions.recruitment@gmail.com"

supabase:
  url: https://mock-project.supabase.co
  jwt:
    issuer: https://mock-project.supabase.co/auth/v1
    jwks-url: https://mock-project.supabase.co/auth/v1/.well-known/jwks.json
    secret: "testsecret012345678901234567890123456789"
