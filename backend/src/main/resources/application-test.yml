spring:
  datasource:
    url: jdbc:h2:mem:careerbridge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

supabase:
  url: https://mock-project.supabase.co
  jwt:
    issuer: https://mock-project.supabase.co/auth/v1
    jwks-url: https://mock-project.supabase.co/auth/v1/.well-known/jwks.json
    secret: "testsecret012345678901234567890123456789"
